name: BeamRT scene asset importer
on:
  push:
    paths:
      - "tools/beamrt_scene_import.py"
      - "tools/beamrt_scene_align.py"
      - "tools/beamrt_bvh_pack.py"
      - "tools/beamrt_native_sun_hook.py"
      - "tools/beamrt_underground_prepare.py"
      - "tools/tests/**"
      - "lua/ge/extensions/beamrt/**"
      - "shaders/beamrt/**"
      - ".github/workflows/beamrt-scene-import.yml"
  pull_request:
    paths:
      - "tools/beamrt_scene_import.py"
      - "tools/beamrt_scene_align.py"
      - "tools/beamrt_bvh_pack.py"
      - "tools/beamrt_native_sun_hook.py"
      - "tools/beamrt_underground_prepare.py"
      - "tools/tests/**"
      - "lua/ge/extensions/beamrt/**"
      - "shaders/beamrt/**"
      - ".github/workflows/beamrt-scene-import.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/beamrt_scene_import.py
      - name: Collada and BVH self-test
        run: python tools/beamrt_scene_import.py --self-test
      - name: Node selection, transforms, material evidence and BVH regression tests
        run: python -B tools/tests/test_scene_align.py
      - name: Packed GPU-data layout and stackless traversal checks
        run: python -B tools/tests/test_bvh_pack.py
      - name: Reversible native-sun integration contract
        run: python -B tools/tests/test_native_sun_hook.py
      - name: Underground visual-node and local-light integration contracts
        run: python -B tools/tests/test_underground_prepare.py
      - name: Syntax check all offline tools and test fixtures
        run: python -m compileall -q tools
  lua-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Lua 5.1 and LuaJIT runtimes for BeamRT checks
        run: python -m pip install "lupa>=2.4,<3"
      - name: Compile main.lua and verify the complete six-input GI binding
        run: python -B tools/tests/test_renderer_contracts.py
      - name: Real Lua module unit tests
        run: |
          python -B tools/tests/test_light_provider.py
          python -B tools/tests/test_mesh_material_policy.py
          python -B tools/tests/test_mesh_sun_control.py
          python -B tools/tests/test_mesh_local_lights.py
          python -B tools/tests/test_noise_source_policy.py
          python -B tools/tests/test_local_light_availability.py
