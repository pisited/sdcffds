name: BeamRT scene asset importer
on:
  push:
    paths:
      - "tools/beamrt_scene_import.py"
      - "tools/beamrt_scene_align.py"
      - "tools/beamrt_bvh_pack.py"
      - "tools/beamrt_native_sun_hook.py"
      - "tools/beamrt_underground_prepare.py"
      - "tools/tests/**"
      - "tools/requirements-tests.txt"
      - "tools/test.ps1"
      - "lua/ge/extensions/beamrt/**"
      - "shaders/beamrt/**"
      - "native/lighting/**"
      - "native/startup/unattended/**"
      - ".github/workflows/beamrt-scene-import.yml"
  pull_request:
    paths:
      - "tools/beamrt_scene_import.py"
      - "tools/beamrt_scene_align.py"
      - "tools/beamrt_bvh_pack.py"
      - "tools/beamrt_native_sun_hook.py"
      - "tools/beamrt_underground_prepare.py"
      - "tools/tests/**"
      - "tools/requirements-tests.txt"
      - "tools/test.ps1"
      - "lua/ge/extensions/beamrt/**"
      - "shaders/beamrt/**"
      - "native/lighting/**"
      - "native/startup/unattended/**"
      - ".github/workflows/beamrt-scene-import.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/beamrt_scene_import.py
      - name: Collada and BVH self-test
        run: python tools/beamrt_scene_import.py --self-test
      - name: Node selection, transforms, material evidence and BVH regression tests
        run: python -B tools/tests/test_scene_align.py
      - name: Packed GPU-data layout and stackless traversal checks
        run: python -B tools/tests/test_bvh_pack.py
      - name: Reversible native-sun integration contract
        run: python -B tools/tests/test_native_sun_hook.py
      - name: Underground visual-node and local-light integration contracts
        run: python -B tools/tests/test_underground_prepare.py
      - name: Syntax check all offline tools and test fixtures
        run: python -m compileall -q tools
  lua-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Lua 5.1 and LuaJIT runtimes for BeamRT checks
        run: python -m pip install --only-binary=:all: -r tools/requirements-tests.txt
      - name: Compile main.lua and verify the complete six-input GI binding
        run: python -B tools/tests/test_renderer_contracts.py
      - name: Real Lua module unit tests
        run: |
          python -B tools/tests/test_light_provider.py
          python -B tools/tests/test_mesh_material_policy.py
          python -B tools/tests/test_mesh_sun_control.py
          python -B tools/tests/test_mesh_local_lights.py
          python -B tools/tests/test_noise_source_policy.py
          python -B tools/tests/test_local_light_availability.py
          python -B tools/tests/test_gi_visibility_buffer.py
          python -B tools/tests/test_reflection_multiscale.py
          python -B tools/tests/test_unattended_observation.py
          python -B tools/tests/test_unattended_ack.py
          python -B tools/tests/test_early_engine_shim.py
          python -B tools/tests/test_unattended_handoff.py
          python -B tools/tests/test_startup_plan.py
          python -B tools/tests/test_protected_inputs.py
          python -B tools/tests/test_outer_child_owner.py
          python -B tools/tests/test_outer_child_session_contracts.py
          python -B tools/tests/test_outer_child_fixture.py
          python -B tools/tests/test_installed_input_coverage.py
          python -B tools/tests/test_input_coverage_lease.py
          python -B tools/tests/test_isolated_profile.py
      - name: Owned-process watchdog policy (CPU-only, no game process)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic native/startup/unattended/watchdog_policy_test.cpp -o "$RUNNER_TEMP/beamrt_watchdog_policy_test"
          "$RUNNER_TEMP/beamrt_watchdog_policy_test"
